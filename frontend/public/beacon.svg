<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9ff"/>
      <stop offset="1" stop-color="#3d7fd6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#00356B"/>
  <!-- shield -->
  <path d="M32 5.5 L53 12.5 V29 C53 43 44 52.5 32 58 C20 52.5 11 43 11 29 V12.5 Z" fill="#0a2a52" stroke="url(#rim)" stroke-width="3.2" stroke-linejoin="round"/>
  <g transform="translate(32 33) scale(0.9) translate(-32 -33)">
    <!-- folded "rose" ears, out to the sides -->
    <path d="M21.6 20.4 C17.4 18.4 12.8 19.6 10.8 23.6 C13.6 23.2 15.8 24.6 17.4 27.6 Z" fill="#c9dcf3"/>
    <path d="M42.4 20.4 C46.6 18.4 51.2 19.6 53.2 23.6 C50.4 23.2 48.2 24.6 46.6 27.6 Z" fill="#c9dcf3"/>
    <path d="M17.6 21.6 C15.6 21.8 14.2 22.6 13.4 23.6" fill="none" stroke="#8fb3e0" stroke-width="1" stroke-linecap="round"/>
    <path d="M46.4 21.6 C48.4 21.8 49.8 22.6 50.6 23.6" fill="none" stroke="#8fb3e0" stroke-width="1" stroke-linecap="round"/>
    <!-- broad head with heavy jowls -->
    <path d="M32 18.5 C38.5 18.5 44 19.8 46.5 23.5 C49 27.5 49.5 33.5 48.2 38.5 C47 43 43 46.8 38 47.2 C35.5 47.4 33.6 46.4 32 45.6 C30.4 46.4 28.5 47.4 26 47.2 C21 46.8 17 43 15.8 38.5 C14.5 33.5 15 27.5 17.5 23.5 C20 19.8 25.5 18.5 32 18.5 Z" fill="#fff"/>
    <!-- forehead folds and a grumpy brow -->
    <path d="M27 22.6 Q32 21.2 37 22.6" fill="none" stroke="#00356B" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M28.6 25 Q32 24 35.4 25" fill="none" stroke="#00356B" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M21.4 26.2 Q24.6 24.4 27.8 26" fill="none" stroke="#00356B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M42.6 26.2 Q39.4 24.4 36.2 26" fill="none" stroke="#00356B" stroke-width="1.6" stroke-linecap="round"/>
    <!-- eyes set wide apart -->
    <circle cx="24.6" cy="29.4" r="2.3" fill="#00356B"/>
    <circle cx="39.4" cy="29.4" r="2.3" fill="#00356B"/>
    <!-- muzzle -->
    <ellipse cx="32" cy="37.8" rx="10.8" ry="7.4" fill="#dce8f6"/>
    <!-- broad flat nose -->
    <path d="M27.2 32.2 Q32 30.4 36.8 32.2 Q36.8 35.3 32 35.9 Q27.2 35.3 27.2 32.2 Z" fill="#00356B"/>
    <ellipse cx="30.4" cy="32.5" rx="1.3" ry="0.6" fill="#fff" opacity="0.45"/>
    <path d="M32 35.9 V38.1" stroke="#00356B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- droopy jowls -->
    <path d="M23 40.8 Q27.4 36.8 32 38.1 Q36.6 36.8 41 40.8" fill="none" stroke="#00356B" stroke-width="1.7" stroke-linecap="round"/>
    <!-- underbite with two teeth -->
    <path d="M26.2 41.8 Q32 45.6 37.8 41.8" fill="none" stroke="#00356B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M27.9 42.5 L28.6 40 L29.7 43.1 Z" fill="#fff" stroke="#00356B" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M36.1 42.5 L35.4 40 L34.3 43.1 Z" fill="#fff" stroke="#00356B" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
